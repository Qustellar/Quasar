name: quality

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path acceptance/consumer/Cargo.toml --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --manifest-path acceptance/consumer/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      - run: cargo run --manifest-path acceptance/consumer/Cargo.toml --locked
        env:
          CARGO_TARGET_DIR: target
      - run: cargo check --workspace
      - run: cargo doc --workspace --no-deps
