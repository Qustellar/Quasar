name: quality

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 1
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Install Linux audio dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path acceptance/consumer/Cargo.toml --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --manifest-path acceptance/consumer/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1
      - run: cargo test --workspace --all-features -- --test-threads=1
      - run: cargo run --manifest-path acceptance/consumer/Cargo.toml --locked
        env:
          CARGO_TARGET_DIR: target
      - run: cargo check --workspace
      - run: cargo doc --workspace --no-deps
